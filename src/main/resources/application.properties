# ===========================
# Configuration de l'application TaskBoard
# ===========================

# Nom de l'application (visible dans les logs)
spring.application.name=taskboard

logging.level.root=INFO
logging.level.com.taskboard=INFO
logging.level.org.springframework.boot.autoconfigure.h2=INFO
logging.level.org.springframework.boot.web.embedded.h2=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO

# --- Base de donnees H2 en memoire ---
# H2 cree une base "volatile" : elle est recreee a chaque demarrage.
# Parfait pour la formation : zero installation, zero configuration externe.
# spring.datasource.url=jdbc:h2:mem:taskboarddb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# --- Console H2 ---
# Permet de visualiser les tables et les donnees via le navigateur.
# Acces : http://localhost:8080/h2-console (JDBC URL : jdbc:h2:mem:taskboarddb)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console



# --- Connexion PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/Taskboarddb
spring.datasource.username="postgres"
spring.datasource.password="john"
spring.datasource.driverClassName=org.postgresql.Driver


# --- JPA / Hibernate ---
# ddl-auto=update : Hibernate cree/met a jour les tables automatiquement
# a partir des entites @Entity (pratique en formation ; en production on
# prefere des migrations versionnees avec Flyway ou Liquibase).
spring.jpa.hibernate.ddl-auto=update

# Affiche les requetes SQL generees dans la console : tres utile en formation
# pour montrer aux apprenants ce que fait reellement Hibernate.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Port du serveur (8080 par defaut, explicite ici pour la clarte)
server.port=8080

server.error.include-message=always
server.error.include-stacktrace=always

# === Swagger ===
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html